<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scoop AI</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" aria-label="Sections">
    <div class="brand">
      <div class="mark" aria-hidden="true">S</div>
      <div>
        <div class="brand-name">Scoop AI</div>
        <div class="brand-sub" id="brand-sub">Local serving monitor</div>
      </div>
    </div>

    <div class="nav-label">Monitor</div>
    <a class="nav-item" href="/" aria-current="page">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="1.8" y="2.5" width="12.4" height="11" rx="2"/><path d="M1.8 6.2h12.4M5.6 2.5v3.7"/>
      </svg>
      <span>Today</span>
    </a>
    <button class="nav-item" id="nav-monitoring" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="8" cy="8" r="6.2"/><path d="M6.4 5.6l4.2 2.4-4.2 2.4z" fill="currentColor" stroke="none"/>
      </svg>
      <span id="nav-monitoring-label">Start monitoring</span>
    </button>

    <div class="nav-label">Configure</div>
    <a class="nav-item" href="/camera">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <rect x="1.6" y="4" width="10" height="8" rx="1.8"/><path d="M11.6 7.4l2.8-1.8v4.8l-2.8-1.8z"/>
      </svg>
      <span>Camera</span>
    </a>
    <button class="nav-item" id="nav-system" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <circle cx="8" cy="8" r="2.1"/>
        <path d="M8 1.6v1.7M8 12.7v1.7M14.4 8h-1.7M3.3 8H1.6M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2M12.5 12.5l-1.2-1.2M4.7 4.7L3.5 3.5"/>
      </svg>
      <span>System</span>
    </button>

    <div class="sidebar-foot">
      <div class="stat" id="stat-service"><span class="dot"></span><span>Checking service</span></div>
      <div class="stat" id="stat-compute"><span class="dot"></span><span>Checking hardware</span></div>
    </div>
  </nav>

  <main class="main">
    <header class="page-head">
      <div>
        <h1>Today</h1>
        <p id="subtitle">Candidate handovers awaiting your review.</p>
      </div>
      <div class="head-tools">
        <label class="visually-hidden" for="date">Business date</label>
        <input class="select" id="date" type="date">
        <label class="visually-hidden" for="filter">Review state</label>
        <select class="select" id="filter">
          <option value="all">All events</option>
          <option value="unreviewed">Unreviewed</option>
          <option value="needs_review">Needs review</option>
          <option value="accepted">Accepted</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
    </header>

    <div class="page-body">
      <dl class="metrics">
        <div class="metric"><dt>AI candidates</dt><dd id="m-candidates">&mdash;</dd></div>
        <div class="metric"><dt>Accepted events</dt><dd id="m-accepted">&mdash;</dd></div>
        <div class="metric"><dt>Confirmed items</dt><dd id="m-items">&mdash;</dd></div>
        <div class="metric pending"><dt>Pending review</dt><dd id="m-pending">&mdash;</dd></div>
      </dl>

      <div class="section-head">
        <h2>Event review</h2>
        <span class="hint" id="event-count"></span>
      </div>

      <section id="events" class="events" aria-live="polite" aria-busy="true">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </section>
    </div>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
const $ = id => document.getElementById(id);
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
}[c]));

let current = [];

const STATE_LABEL = {
  unreviewed: 'Unreviewed', needs_review: 'Needs review',
  accepted: 'Accepted', rejected: 'Rejected'
};

function localDate() {
  const d = new Date();
  return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
}

const timeLabel = value =>
  new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date(value));

function confidenceLabel(value) {
  if (value === null) return 'No confidence';
  if (value >= 0.5) return 'High confidence';
  if (value >= 0.2) return 'Medium confidence';
  return 'Low confidence';
}

const routeLabel = value =>
  value === 'pickup_to_customer' ? 'Pickup to customer'
  : value === 'customer_only_departure' ? 'Customer-zone handover'
  : 'Handover candidate';

function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(node.dataset.timer);
  node.dataset.timer = setTimeout(() => node.classList.remove('show'), 2400);
}

function setStat(id, className, text) {
  const node = $(id);
  node.className = `stat ${className}`;
  node.querySelector('span:last-child').textContent = text;
}

function eventMarkup(event, index) {
  const thumb = event.has_evidence
    ? `<img class="thumb" loading="lazy" src="/evidence/${encodeURIComponent(event.event_id)}"
            alt="Evidence captured at ${escapeHtml(timeLabel(event.occurred_at))}">`
    : '<div class="thumb empty">No evidence</div>';
  return `<article class="event">
    ${thumb}
    <div>
      <p class="event-time">${escapeHtml(timeLabel(event.occurred_at))}</p>
      <div class="event-meta">
        <span class="pill ${escapeHtml(event.review_state)}">${escapeHtml(STATE_LABEL[event.review_state] || event.review_state)}</span>
        <span class="pill">${escapeHtml(routeLabel(event.route))}</span>
        <span class="pill">${escapeHtml(confidenceLabel(event.confidence))}</span>
        <span class="pill">${escapeHtml(event.camera_id)}</span>
      </div>
    </div>
    <div class="event-actions">
      <div class="qty" role="group" aria-label="Item quantity">
        <button type="button" data-action="minus" data-index="${index}" aria-label="Decrease quantity">&minus;</button>
        <output id="qty-${index}">${event.quantity}</output>
        <button type="button" data-action="plus" data-index="${index}" aria-label="Increase quantity">+</button>
      </div>
      <button class="btn primary" data-action="accepted" data-index="${index}">Accept</button>
      <button class="btn danger" data-action="rejected" data-index="${index}">Reject</button>
      <button class="btn ghost" data-action="needs_review" data-index="${index}">Later</button>
    </div>
  </article>`;
}

function render(data) {
  $('m-candidates').textContent = data.summary.candidate_events;
  $('m-accepted').textContent = data.summary.accepted_events;
  $('m-items').textContent = data.summary.confirmed_items;
  $('m-pending').textContent = data.summary.pending_review;

  setStat('stat-service', data.system.online ? 'online' : 'offline', data.system.detail);

  current = data.events;
  const container = $('events');
  container.setAttribute('aria-busy', 'false');
  $('event-count').textContent = current.length
    ? `${current.length} shown` : '';

  if (!current.length) {
    container.innerHTML = `<div class="empty">
      <strong>Nothing to review</strong>
      <span>No events match this date and filter. Candidates appear here as soon as monitoring detects a handover.</span>
    </div>`;
    return;
  }
  container.innerHTML = current.map(eventMarkup).join('');
}

async function loadCompute() {
  try {
    const response = await fetch('/api/system/compute');
    if (!response.ok) return;
    const data = await response.json();
    setStat('stat-compute', data.accelerated ? 'online' : 'warn', data.headline);
    $('stat-compute').title = data.accelerated
      ? 'Model inference runs on the GPU.'
      : `Model inference runs on the CPU. Analysis is capped at ${data.recommended_analysis_fps} frames per second.`;
  } catch (error) { /* the sidebar keeps its placeholder */ }
}

async function loadProduct() {
  try {
    const response = await fetch('/api/product/status');
    if (!response.ok) return;
    const data = await response.json();
    if (data.shop_name) $('brand-sub').textContent = data.shop_name;
    const button = $('nav-monitoring');
    button.dataset.running = String(data.monitoring);
    button.disabled = !data.configured;
    $('nav-monitoring-label').textContent = data.monitoring ? 'Stop monitoring' : 'Start monitoring';
  } catch (error) { /* monitoring control stays as-is */ }
}

async function load() {
  try {
    const query = `date=${encodeURIComponent($('date').value)}&state=${encodeURIComponent($('filter').value)}`;
    const response = await fetch(`/api/dashboard?${query}`);
    if (!response.ok) throw new Error('The dashboard service did not respond');
    render(await response.json());
    loadProduct();
  } catch (error) {
    $('events').setAttribute('aria-busy', 'false');
    $('events').innerHTML = `<div class="empty">
      <strong>Could not load events</strong>
      <span>${escapeHtml(error.message)}. Check that the local Scoop AI service is running.</span>
    </div>`;
  }
}

async function review(index, decision) {
  const event = current[index];
  const quantity = Number($(`qty-${index}`).textContent);
  const buttons = document.querySelectorAll(`[data-index="${index}"]`);
  buttons.forEach(button => button.disabled = true);
  try {
    const response = await fetch(`/api/events/${encodeURIComponent(event.event_id)}/review`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ decision, quantity })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'The review could not be saved');
    toast(decision === 'accepted'
      ? `Accepted ${quantity} item${quantity === 1 ? '' : 's'}`
      : STATE_LABEL[decision]);
    await load();
  } catch (error) {
    toast(error.message);
    buttons.forEach(button => button.disabled = false);
  }
}

$('events').addEventListener('click', event => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const index = Number(button.dataset.index);
  const action = button.dataset.action;
  if (action === 'plus' || action === 'minus') {
    const output = $(`qty-${index}`);
    output.textContent = Math.max(1, Math.min(50, Number(output.textContent) + (action === 'plus' ? 1 : -1)));
    return;
  }
  review(index, action);
});

$('nav-monitoring').onclick = async () => {
  const button = $('nav-monitoring');
  const action = button.dataset.running === 'true' ? 'stop' : 'start';
  button.disabled = true;
  try {
    const response = await fetch(`/api/monitoring/${action}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'The monitoring service did not respond');
    toast(data.monitoring ? 'Monitoring started' : 'Monitoring stopped');
    setTimeout(load, 1000);
  } catch (error) {
    toast(error.message);
  } finally {
    button.disabled = false;
    loadProduct();
  }
};

$('nav-system').onclick = () => { location.href = '/system'; };

$('date').value = localDate();
$('date').addEventListener('change', load);
$('filter').addEventListener('change', load);
load();
loadCompute();
setInterval(load, 30000);
</script>
</body>
</html>
