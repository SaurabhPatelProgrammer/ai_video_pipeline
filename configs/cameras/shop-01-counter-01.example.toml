[camera]
camera_id = "shop-01-counter-01"
enabled = true
mode = "live"
pipeline = "handover"
# Resolve this reference through the Windows credential provider. Never store
# the RTSP URL/password in version-controlled configuration.
credential_key = "scoop-ai/shop-01-counter-01/rtsp-url"
analysis_fps = 10.0
# Generate this versioned profile with `scoop-ai recalibrate` before production.
calibration_profile = "D:\\ip-camera-ai-data\\calibration\\shop-01-counter-01.json"
expected_width = 1920
expected_height = 1080

[zones]
# For the handover pipeline, tub is the pickup/preparation zone and serving is
# the customer handover zone. Recalibrate both against the locked camera view.
tub = [[0.28, 0.52], [0.75, 0.52], [0.75, 0.87], [0.28, 0.87]]
serving = [[0.15, 0.25], [0.56, 0.25], [0.56, 0.49], [0.15, 0.49]]

[quality]
minimum_blur_variance = 20.0
pixel_change_threshold = 35
maximum_changed_fraction = 0.65
analysis_width = 320
reference_drift_threshold = 0.20
zone_change_threshold = 0.45
obstruction_seconds = 1.0
minimum_fps_ratio = 0.50

[event]
# Used only by the legacy three-class deposit pipeline.
minimum_confidence = 0.35
approach_distance = 0.18
exit_distance = 0.24
minimum_approach_seconds = 0.10
minimum_release_seconds = 0.08
sequence_timeout_seconds = 8.0
missing_tolerance_seconds = 0.35

[handover]
# Used by the one-class ice_cream_item pipeline. An omitted confidence uses
# the checksum-verified model manifest threshold.
maximum_center_distance_pixels = 120.0
lost_track_seconds = 1.0
minimum_consecutive_frames = 1
duplicate_iou_threshold = 0.50
minimum_transfer_seconds = 0.20
minimum_customer_dwell_seconds = 0.12
minimum_customer_observations = 2
minimum_movement_distance = 0.03
sequence_timeout_seconds = 5.0
missing_tolerance_seconds = 1.0
duplicate_cooldown_seconds = 3.5
duplicate_distance = 0.12
# Customer-only route: counts an item seen leaving the customer zone whose
# pickup the detector never observed. It recovers missed pickups but is the
# only route that counts with no pickup evidence, so raise these thresholds if
# review shows false positives at this site.
customer_only_minimum_seconds = 0.50
customer_only_minimum_observations = 3
customer_only_minimum_movement = 0.025
customer_only_static_minimum_seconds = 1.50
customer_only_static_minimum_observations = 6

[capture]
reconnect_seconds = 3.0
reconnect_max_seconds = 30.0
reconnect_jitter_ratio = 0.20
open_timeout_ms = 5000
read_timeout_ms = 5000
read_wait_seconds = 2.0
rtsp_transport = "tcp"
