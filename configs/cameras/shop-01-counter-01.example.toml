[camera]
camera_id = "shop-01-counter-01"
enabled = true
mode = "live"
# Resolve this reference through the Windows credential provider. Never store
# the RTSP URL/password in version-controlled configuration.
credential_key = "scoop-ai/shop-01-counter-01/rtsp-url"
analysis_fps = 10.0

[zones]
# Normalized points must be recalibrated against the locked production view.
tub = [[0.28, 0.52], [0.75, 0.52], [0.75, 0.87], [0.28, 0.87]]
serving = [[0.15, 0.25], [0.56, 0.25], [0.56, 0.49], [0.15, 0.49]]

[quality]
minimum_blur_variance = 20.0
pixel_change_threshold = 35
maximum_changed_fraction = 0.65
analysis_width = 320

[event]
minimum_confidence = 0.35
approach_distance = 0.18
exit_distance = 0.24
minimum_approach_seconds = 0.10
minimum_release_seconds = 0.08
sequence_timeout_seconds = 8.0
missing_tolerance_seconds = 0.35

[capture]
reconnect_seconds = 3.0
reconnect_max_seconds = 30.0
reconnect_jitter_ratio = 0.20
open_timeout_ms = 5000
read_timeout_ms = 5000
read_wait_seconds = 2.0
rtsp_transport = "tcp"
