[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scoop-ai"
version = "0.1.0"
description = "Deterministic IP-camera capture foundation for scoop event detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.0,<3",
    "opencv-python==4.12.0.88",
    "rfdetr==1.8.3",
    "supervision==0.29.1",
    "keyring==25.7.0",
    "PySide6==6.11.1",
    "pywin32==312; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.13,<0.17",
]

[project.scripts]
scoop-ai = "scoop_ai.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["scoop_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", "artifacts", "datasets", "models"]

[tool.ruff.lint]
# Correctness only. F catches undefined names, unused imports, and unreachable
# assignments; E9 catches syntax and IO errors. Style rules are deliberately
# excluded so the gate never produces noise that trains reviewers to ignore it.
select = ["F", "E9"]
