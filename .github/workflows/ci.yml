name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU runtime and project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip "setuptools>=78.1.1,<82"
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit==2.10.1

      - name: Generate dependency SBOM
        continue-on-error: true
        run: python -m pip_audit --local --format cyclonedx-json --output sbom.cdx.json

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@v4
        with:
          name: scoop-ai-python-sbom
          path: sbom.cdx.json
          if-no-files-found: error

      - name: Audit installed dependencies
        # Torch 2.11 requires setuptools<82. PYSEC-2026-3447 concerns Unicode
        # normalization while building source distributions on macOS; this
        # Windows runtime neither accepts nor builds untrusted source trees.
        run: python -m pip_audit --local --progress-spinner off --ignore-vuln PYSEC-2026-3447

      - name: Compile source
        run: python -m compileall -q src tests

      - name: Lint for correctness defects
        run: python -m ruff check src tests scripts

      - name: Run tests
        run: python -m pytest -q
