name: Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cu130
          python -m pip install -e ".[dev]" pyinstaller
          choco install innosetup --no-progress -y
      - name: Build verified installer
        shell: pwsh
        run: .\build-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ScoopAI-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
